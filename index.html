<style>
:root{
  --ink:#0B1015; --slate:#161E27; --line:#26313D;
  --paper:#E8EDF2; --mute:#7A8899;
  --lake:#2E9BD6; --flag:#C8102E; --gold:#E4B429; --moss:#4FB477;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--ink); color:var(--paper);
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}

/* SPLASH */
#splash{
  position:fixed;inset:0;background:var(--ink);z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .4s;
}
#splash.out{opacity:0;pointer-events:none}
.sp-star{width:64px;height:64px;background:var(--flag);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.88);opacity:.7}}
.sp-t{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sp-t em{font-style:normal;color:var(--lake)}

.hd{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,var(--ink) 70%,rgba(11,16,21,.92));
  backdrop-filter:blur(12px);
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  border-bottom:1px solid var(--line);
}
.hd-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hd h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:.95}
.hd h1 em{font-style:normal;color:var(--lake)}
.stars{display:flex;gap:3px;margin-top:5px}
.star{width:9px;height:9px;background:var(--flag);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.cd{text-align:right;flex-shrink:0}
.cd-n{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;color:var(--gold);line-height:1}
.cd-l{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:.14em;margin-top:3px}

.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(22,30,39,.96);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  background:none;border:none;color:var(--mute);padding:12px 2px 11px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .18s;position:relative;
}
.tab svg{width:18px;height:18px;stroke-width:1.8}
.tab.on{color:var(--paper)}
.tab.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--lake)}

.view{display:none;padding:16px 14px 20px;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mute);margin:22px 2px 9px;display:flex;align-items:center;gap:9px;
}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--line)}
.eyebrow:first-child{margin-top:2px}

.hero{background:var(--slate);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--lake)}
.hero.q::before{background:var(--flag)}
.hero.lr::before{background:var(--gold)}
.hero.off::before{background:var(--line)}
.hero.race::before{background:linear-gradient(180deg,var(--flag),var(--gold),var(--lake))}

.h-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.pill{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:rgba(46,155,214,.16);color:var(--lake)}
.pill.q{background:rgba(200,16,46,.18);color:#F26B7F}
.pill.lr{background:rgba(228,180,41,.16);color:var(--gold)}
.pill.off{background:rgba(122,136,153,.14);color:var(--mute)}
.h-date{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mute);letter-spacing:.06em}
.h-title{font-family:'Barlow Condensed',sans-serif;font-size:31px;font-weight:700;letter-spacing:.01em;line-height:1.02;margin-bottom:10px}
.h-detail{font-size:14px;line-height:1.55;color:#C3CDD8}
.h-stats{display:flex;gap:22px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.st-n{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:700;line-height:1}
.st-l{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:.13em;margin-top:4px}

/* boton completar */
.done-btn{
  width:100%;margin-top:15px;padding:14px;border-radius:11px;border:1px solid var(--line);
  background:var(--ink);color:var(--paper);cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:all .2s;
}
.done-btn svg{width:18px;height:18px}
.done-btn.ok{background:rgba(79,180,119,.15);border-color:var(--moss);color:var(--moss)}
.done-btn:active{transform:scale(.98)}

.blk{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}
.blk-h{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--paper);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.blk-h span{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--mute);letter-spacing:.06em;font-weight:400;margin-left:auto}

.ex{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid rgba(38,49,61,.6)}
.ex:last-child{border-bottom:none;padding-bottom:0}
.ex-chk{
  width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;background:var(--ink);
}
.ex-chk svg{width:13px;height:13px;opacity:0;transition:opacity .15s;color:var(--ink)}
.ex-chk.on{background:var(--moss);border-color:var(--moss)}
.ex-chk.on svg{opacity:1}
.ex.done .ex-name{text-decoration:line-through;color:var(--mute)}
.ex-n{flex:1;min-width:0}
.ex-name{font-size:13.5px;font-weight:500;line-height:1.3;transition:color .15s}
.ex-set{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mute);margin-top:2px}
.ex-v{flex-shrink:0;width:32px;height:32px;border-radius:8px;background:rgba(46,155,214,.12);border:1px solid rgba(46,155,214,.28);display:flex;align-items:center;justify-content:center;color:var(--lake);text-decoration:none;transition:all .15s}
.ex-v:active{background:rgba(46,155,214,.3);transform:scale(.93)}
.ex-v svg{width:14px;height:14px}

.nut{font-size:13px;line-height:1.65;color:#C3CDD8}
.nut b{color:var(--gold);font-weight:600}

/* notas + peso */
.inp{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;
  color:var(--paper);padding:11px 12px;font-family:'Inter',sans-serif;font-size:14px;
  resize:none;outline:none;transition:border-color .15s;
}
.inp:focus{border-color:var(--lake)}
textarea.inp{min-height:74px}
.w-row{display:flex;gap:9px;align-items:center}
.w-row .inp{flex:1;font-family:'JetBrains Mono',monospace;font-size:16px;text-align:center}
.w-save{
  background:var(--lake);border:none;color:#fff;border-radius:9px;padding:11px 18px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
}
.w-save:active{transform:scale(.96)}
.w-last{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mute);margin-top:8px}
.saved-flash{color:var(--moss)!important}

.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.wk-btn{background:var(--slate);border:1px solid var(--line);color:var(--paper);width:40px;height:40px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.wk-btn:active{background:var(--line)}
.wk-btn:disabled{opacity:.3}
.wk-btn svg{width:17px;height:17px}
.wk-info{text-align:center;flex:1}
.wk-n{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.wk-f{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mute);margin-top:4px;letter-spacing:.05em}
.wk-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.wk-c{background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center}
.wk-c-n{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700}
.wk-c-l{font-size:8.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.11em;margin-top:4px}

.day{display:flex;gap:12px;padding:13px 14px;background:var(--slate);border:1px solid var(--line);border-radius:11px;margin-bottom:7px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.day::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lake)}
.day.q::before{background:var(--flag)}
.day.lr::before{background:var(--gold)}
.day.off::before{background:var(--line)}
.day.race::before{background:linear-gradient(180deg,var(--flag),var(--gold))}
.day:active{background:#1B242F}
.day.today{border-color:var(--lake);box-shadow:0 0 0 1px rgba(46,155,214,.3)}
.day.completed{opacity:.55}
.day.completed .day-t{text-decoration:line-through}
.day-l{width:34px;flex-shrink:0;text-align:center}
.day-d{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.day-n{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;margin-top:1px}
.day-c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.day-t{font-size:14px;font-weight:600;line-height:1.25}
.day-s{font-size:11px;color:var(--mute);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-km{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;align-self:center;flex-shrink:0;color:var(--lake)}
.day.off .day-km{color:var(--mute);font-size:12px}
.day-ok{position:absolute;top:8px;right:9px;width:15px;height:15px;color:var(--moss)}

.pg-hero{background:var(--slate);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;margin-bottom:12px}
.pg-big{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;color:var(--lake);line-height:1}
.pg-sub{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.14em;margin-top:7px}
.bar{height:7px;background:var(--ink);border-radius:4px;overflow:hidden;margin-top:16px;border:1px solid var(--line)}
.bar-f{height:100%;background:linear-gradient(90deg,var(--lake),var(--moss));border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mini{background:var(--slate);border:1px solid var(--line);border-radius:11px;padding:14px}
.mini-n{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700}
.mini-l{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em;margin-top:5px;line-height:1.3}
.mini-s{font-size:11px;color:var(--paper);margin-top:4px;font-weight:500;line-height:1.3}
.mini-d{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--mute);margin-top:2px}
.next{background:var(--slate);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:8px;position:relative;overflow:hidden}
.next::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.next.lr::before{background:var(--gold)}
.next.q::before{background:var(--flag)}
.next-l{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--mute)}
.next-t{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-top:4px}
.next-d{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mute);margin-top:3px}

.chart{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:16px 14px 12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-bottom:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:4px}
.bfill{width:100%;border-radius:3px 3px 0 0;background:var(--lake);opacity:.55;transition:all .3s;min-height:3px}
.bcol.now .bfill{opacity:1;background:var(--gold)}
.bcol.done .bfill{opacity:.85;background:var(--moss)}
.bcol.taper .bfill{background:var(--mute)}
.blab{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--mute)}
.bval{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--paper);font-weight:700}

.rit{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(38,49,61,.6)}
.rit:last-child{border-bottom:none;padding-bottom:0}
.rit-k{display:flex;align-items:center;gap:10px}
.rit-b{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;flex-shrink:0}
.rit-n{font-size:13px;font-weight:500}
.rit-d{font-size:10px;color:var(--mute);margin-top:1px}
.rit-v{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700}

.ov{position:fixed;inset:0;background:rgba(11,16,21,.85);backdrop-filter:blur(6px);z-index:100;display:none;align-items:flex-end}
.ov.on{display:flex;animation:fade .2s}
.sheet{background:var(--slate);border-top:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:8px 16px calc(28px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 16px}



/* sub-tabs */
.subtabs{display:flex;gap:6px;background:var(--slate);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px}
.subtab{flex:1;background:none;border:none;color:var(--mute);padding:10px 6px;border-radius:8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;transition:all .18s}
.subtab.on{background:var(--lake);color:#fff}
.subtab:active{transform:scale(.97)}

/* lista de compras */
.shop{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:6px 15px;margin-bottom:10px}
.shop-i{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(38,49,61,.6)}
.shop-i:last-child{border-bottom:none}
.shop-chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;background:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.shop-chk svg{width:13px;height:13px;opacity:0;color:var(--ink)}
.shop-chk.on{background:var(--moss);border-color:var(--moss)}
.shop-chk.on svg{opacity:1}
.shop-n{flex:1;font-size:14px;font-weight:500}
.shop-i.done .shop-n{text-decoration:line-through;color:var(--mute)}
.shop-v{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--lake);flex-shrink:0}
.shop-i.done .shop-v{color:var(--mute)}


/* ---- TENIS ---- */
.shoe{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(38,49,61,.6)}
.shoe:last-child{border-bottom:none}
.shoe-ic{width:38px;height:38px;border-radius:10px;background:var(--ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px}
.shoe-c{flex:1;min-width:0}
.shoe-n{font-size:13.5px;font-weight:600}
.shoe-bar{height:5px;background:var(--ink);border-radius:3px;margin-top:6px;overflow:hidden;border:1px solid var(--line)}
.shoe-fill{height:100%;border-radius:3px;background:var(--moss);transition:width .4s}
.shoe-fill.warn{background:var(--gold)}
.shoe-fill.bad{background:var(--flag)}
.shoe-km{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;flex-shrink:0;text-align:right}
.shoe-life{font-size:9px;color:var(--mute);margin-top:2px}
.shoe-del{width:26px;height:26px;border-radius:7px;background:none;border:1px solid var(--line);color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shoe-del svg{width:12px;height:12px}
.shoe-add{display:flex;gap:8px;margin-top:12px}
.shoe-add .inp{flex:1;font-size:13px}
.shoe-sel{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--paper);padding:11px 12px;font-family:'Inter',sans-serif;font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
.run-log{display:flex;gap:8px;align-items:center;margin-top:10px}
.run-log .shoe-sel{flex:1}

/* ---- GRAFICAS SVG ---- */
.gwrap{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:16px 14px;margin-bottom:10px}
.gtitle{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline}
.gtitle span{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--mute);font-weight:400;letter-spacing:.05em}
.gsvg{width:100%;height:auto;display:block}
.glegend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.gleg{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--mute)}
.gleg i{width:8px;height:8px;border-radius:2px;display:block}

/* ---- PREDICCION ---- */
.pred{background:linear-gradient(135deg,#161E27,#1A2530);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden}
.pred::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--flag),var(--gold),var(--lake))}
.pred-l{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.16em}
.pred-t{font-family:'JetBrains Mono',monospace;font-size:46px;font-weight:700;line-height:1.05;margin:8px 0 4px}
.pred-s{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute)}
.pred-badge{display:inline-block;margin-top:10px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:5px 14px;border-radius:6px}

/* ---- NUTRICION ---- */
.macro-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.macro{background:var(--slate);border:1px solid var(--line);border-radius:11px;padding:12px 8px;text-align:center;position:relative;overflow:hidden}
.macro::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.macro.kc::before{background:var(--gold)}
.macro.p::before{background:var(--flag)}
.macro.c::before{background:var(--lake)}
.macro.g::before{background:var(--moss)}
.macro-n{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;line-height:1}
.macro-u{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--mute);margin-left:1px}
.macro-l{font-size:8px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin-top:5px}

.meal{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px;position:relative;overflow:hidden}
.meal::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.meal.d::before{background:var(--gold)}
.meal.c::before{background:var(--lake)}
.meal.n::before{background:var(--moss)}
.meal.i::before{background:var(--flag)}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.meal-t{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.meal-hr{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--mute)}
.meal-b{font-size:13.5px;line-height:1.6;color:#C3CDD8}

.tag-nut{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;padding:3px 9px;border-radius:4px;margin-bottom:10px}
.tag-nut.LARGO{background:rgba(228,180,41,.16);color:var(--gold)}
.tag-nut.CALIDAD{background:rgba(200,16,46,.18);color:#F26B7F}
.tag-nut.EASY{background:rgba(46,155,214,.16);color:var(--lake)}
.tag-nut.CROSS{background:rgba(155,107,214,.16);color:#B98BE8}
.tag-nut.DESCANSO{background:rgba(122,136,153,.14);color:var(--mute)}
.tag-nut.CARRERA{background:rgba(79,180,119,.18);color:var(--moss)}

.nut-note{background:rgba(46,155,214,.08);border:1px solid rgba(46,155,214,.2);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.55;color:#B8C4D0;margin-bottom:12px}
.nut-note b{color:var(--lake)}

.wk-nut{display:flex;gap:10px;padding:11px 13px;background:var(--slate);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;align-items:center;cursor:pointer}
.wk-nut:active{background:#1B242F}
.wk-nut.today{border-color:var(--lake)}
.wk-nut-d{width:32px;flex-shrink:0}
.wk-nut-dd{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.wk-nut-dn{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700}
.wk-nut-c{flex:1;min-width:0}
.wk-nut-t{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-nut-m{font-family:'JetBrains Mono',monospace;font-size:11px;margin-top:2px}
.wk-nut-m span{color:var(--mute)}
.wk-nut-k{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--gold);flex-shrink:0}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

// ============ STORAGE ============
const store = {
  get(k, def){ try{ const v = localStorage.getItem('ch26_'+k); return v===null?def:JSON.parse(v);}catch(e){return def} },
  set(k, v){ try{ localStorage.setItem('ch26_'+k, JSON.stringify(v)); }catch(e){} }
};
let done = store.get('done', {});        // {fecha: true}
let exdone = store.get('exdone', {});    // {fecha: [idx,...]}

let lastTab = store.get('tab', 'hoy');

function tipo(d){
  const t = d.t || '';
  if(t.includes('MARATON CHICAGO')) return 'race';
  if(t.includes('LONG RUN')) return 'lr';
  if(/INTERVALOS|TEMPO|THRESHOLD|RITMO MARATON/.test(t)) return 'q';
  if(t === 'OFF' || t.includes('OFF running')) return 'off';
  return '';
}
function ritmoTipo(d){
  const t = d.t||'';
  if(/INTERVALOS/.test(t)) return 'I';
  if(/TEMPO|THRESHOLD/.test(t)) return 'T';
  if(/RITMO MARATON|MARATON CHICAGO/.test(t)) return 'M';
  if(/LONG RUN/.test(t)) return 'E';
  if(d.km) return 'E';
  return null;
}
function lbl(k){ return {race:'Carrera',lr:'Long run',q:'Calidad',off:'Descanso'}[k] || 'Easy'; }
function fmtF(s){ const d = new Date(s+'T12:00:00'); return `${DIAS[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`; }
function hoyISO(){ const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
function idxHoy(){
  const h = hoyISO();
  let i = P.findIndex(d => d.f === h);
  if(i >= 0) return i;
  i = P.findIndex(d => d.f > h);
  return i >= 0 ? i : P.length-1;
}
function nutHTML(n){
  return (n||'').split('|').map(s=>s.trim()).filter(Boolean).map(s=>{
    const p = s.split(':');
    return p.length>1 ? `<b>${p[0]}:</b>${p.slice(1).join(':')}` : s;
  }).join('<br>');
}

function cd(){
  const ms = RACE - new Date();
  document.getElementById('cdN').textContent = ms > 0 ? Math.ceil(ms/86400000) : '0';
}
cd(); setInterval(cd, 60000);

// ============ HOY ============
function renderHoy(){
  const i = idxHoy(), d = P[i], k = tipo(d);
  const r = RITMOS[d.v];
  const rt = ritmoTipo(d);
  const isDone = !!done[d.f];
  const exd = exdone[d.f] || [];
  let h = '';

  h += `<div class="hero ${k}">
    <div class="h-meta">
      <span class="pill ${k}">${lbl(k)}</span>
      <span class="h-date">${fmtF(d.f)} · Sem ${d.s}</span>
    </div>
    <div class="h-title">${d.t}</div>
    <div class="h-detail">${d.det}</div>
    <div class="h-stats">
      ${d.km ? `<div><div class="st-n">${d.km}</div><div class="st-l">km</div></div>` : ''}
      <div><div class="st-n">${d.v}</div><div class="st-l">VDOT</div></div>
      <div><div class="st-n" style="font-size:15px;padding-top:4px">${d.fase}</div><div class="st-l">Fase</div></div>
    </div>
    <button class="done-btn ${isDone?'ok':''}" onclick="toggleDone('${d.f}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12l5 5L20 6"/></svg>
      ${isDone ? 'Completado' : 'Marcar completado'}
    </button>
  </div>`;

  if(d.km && rt){
    const [kk,nn,dd,cc] = RIT_INFO.find(x=>x[0]===rt);
    h += `<div class="eyebrow">Objetivo de hoy</div><div class="blk">
      <div class="rit"><div class="rit-k"><div class="rit-b" style="background:${cc}22;color:${cc}">${kk}</div>
        <div><div class="rit-n">Ritmo ${nn}</div><div class="rit-d">${dd}</div></div></div>
        <div class="rit-v" style="color:${cc}">${r[rt]}</div></div>
      <div class="rit"><div class="rit-k"><div class="rit-b" style="background:#C8102E22;color:#F26B7F">♥</div>
        <div><div class="rit-n">FC objetivo</div><div class="rit-d">Zona para este entreno</div></div></div>
        <div class="rit-v" style="color:#F26B7F;font-size:11px">${FC[rt]}</div></div>
    </div>`;
  }

  if(d.km){
    h += `<div class="eyebrow">Todos los ritmos</div><div class="blk">`;
    RIT_INFO.forEach(([kk,n,ds,c]) => {
      h += `<div class="rit"><div class="rit-k">
        <div class="rit-b" style="background:${c}22;color:${c}">${kk}</div>
        <div><div class="rit-n">${n}</div><div class="rit-d">${ds}</div></div>
      </div><div class="rit-v" style="color:${c}">${r[kk]}</div></div>`;
    });
    h += `</div>`;
  }

  if(d.ej && d.ej.length){
    const bloque = d.ej[0].b || 'Fuerza';
    const nd = exd.length;
    h += `<div class="eyebrow">Fuerza</div>
    <div class="blk"><div class="blk-h">${bloque}<span>${nd}/${d.ej.length}</span></div>`;
    d.ej.forEach((e,ix) => {
      const on = exd.includes(ix);
      h += `<div class="ex ${on?'done':''}">
        <div class="ex-chk ${on?'on':''}" onclick="toggleEx('${d.f}',${ix})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M4 12l5 5L20 6"/></svg></div>
        <div class="ex-n"><div class="ex-name">${e.n}</div>${e.s?`<div class="ex-set">${e.s}</div>`:''}</div>
        ${e.v?`<a class="ex-v" href="${e.v}" target="_blank" rel="noopener" aria-label="Ver video de ${e.n}">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></a>`:''}
      </div>`;
    });
    h += `</div>`;
  }

  h += `<div class="eyebrow">Nutrición</div><div class="blk"><div class="nut">${nutHTML(d.nut)}</div></div>`;

  // notas
  h += `<div class="eyebrow">Notas del día</div><div class="blk">
    <textarea class="inp" id="notaIn" placeholder="¿Cómo te sentiste? Molestias, sensaciones, clima...">${notas[d.f]||''}</textarea>
    <div class="w-last" id="notaSt" style="margin-top:6px">${notas[d.f]?'Guardada':''}</div>
  </div>`;

  document.getElementById('v-hoy').innerHTML = h;

  // autosave nota
  const ta = document.getElementById('notaIn');
  let t;
  ta.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      notas[d.f] = ta.value;
      store.set('notas', notas);
      const st = document.getElementById('notaSt');
      st.textContent = 'Guardada ✓'; st.classList.add('saved-flash');
      setTimeout(()=>st.classList.remove('saved-flash'), 900);
    }, 600);
  });
}

function toggleDone(f){
  if(done[f]) delete done[f]; else done[f] = true;
  store.set('done', done);
  renderHoy();
}
function toggleEx(f, ix){
  const a = exdone[f] || [];
  const p = a.indexOf(ix);
  if(p>=0) a.splice(p,1); else a.push(ix);
  exdone[f] = a;
  store.set('exdone', exdone);
  renderHoy();
}

let shoes = store.get('shoes', [
  {id:1, n:'Adidas Evo SL', base:120},
  {id:2, n:'On Cloudmonster 2', base:210},
  {id:3, n:'Nike Vaporfly', base:95}
]);
let runShoe = store.get('runshoe', {});   // {fecha: shoeId}
const SHOE_LIFE = 650;

function kmShoe(id){
  const base = (shoes.find(x=>x.id===id)||{}).base || 0;
  const extra = P.filter(d => done[d.f] && runShoe[d.f]===id).reduce((a,b)=>a+(b.km||0),0);
  return base + extra;
}
function kmZap(mode){
  if(!shoes.length) return 0;
  const tot = shoes.map(x=>kmShoe(x.id));
  return mode==='act' ? Math.max(...tot) : tot.reduce((a,b)=>a+b,0);
}
function addShoe(){
  const inp = document.getElementById('shoeN');
  const base = parseInt(document.getElementById('shoeB').value)||0;
  if(!inp.value.trim()) return;
  const id = Math.max(0,...shoes.map(x=>x.id))+1;
  shoes.push({id, n:inp.value.trim(), base});
  store.set('shoes', shoes);
  renderDash();
}
function delShoe(id){
  if(!confirm('¿Eliminar este par?')) return;
  shoes = shoes.filter(x=>x.id!==id);
  store.set('shoes', shoes);
  renderDash();
}
function setRunShoe(f, id){
  if(id) runShoe[f] = parseInt(id); else delete runShoe[f];
  store.set('runshoe', runShoe);
}

function svgLine(pts, W, H, color, fill){
  if(pts.length<2) return '';
  const xs = pts.map((p,i)=> (i/(pts.length-1))*W );
  const mx = Math.max(...pts)*1.12 || 1;
  const ys = pts.map(p => H - (p/mx)*H*0.88 - H*0.04);
  let d = `M${xs[0]},${ys[0]}`;
  for(let i=1;i<pts.length;i++){
    const cx = (xs[i-1]+xs[i])/2;
    d += ` C${cx},${ys[i-1]} ${cx},${ys[i]} ${xs[i]},${ys[i]}`;
  }
  let out = '';
  if(fill) out += `<path d="${d} L${W},${H} L0,${H} Z" fill="${color}" opacity=".12"/>`;
  out += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round"/>`;
  return out;
}
function svgDots(pts, W, H, color, mx){
  const xs = pts.map((p,i)=> (i/(pts.length-1))*W );
  mx = mx || Math.max(...pts)*1.12 || 1;
  return pts.map((p,i)=>{
    const y = H - (p/mx)*H*0.88 - H*0.04;
    return `<circle cx="${xs[i]}" cy="${y}" r="3" fill="${color}"/>`;
  }).join('');
}

// ============ PREDICCION ============
function prediccion(){
  // Basado en cumplimiento acumulado + progresion VDOT del plan
  const hoy = hoyISO();
  const past = P.filter(d => d.f < hoy && d.km > 0);
  const doneKm = past.filter(d=>done[d.f]).reduce((a,b)=>a+b.km,0);
  const planKm = past.reduce((a,b)=>a+b.km,0);
  const cumpl = planKm > 0 ? doneKm/planKm : 1;

  // VDOT efectivo: interpola 50->54 segun avance del plan, castiga por bajo cumplimiento
  const i = idxHoy();
  const avance = i / (P.length-1);
  let vdotProg = 50 + 4*avance;
  const factor = Math.min(1, Math.max(0.6, cumpl));
  const vdotEf = 50 + (vdotProg - 50) * factor;

  // Tiempo maraton segun VDOT (regresion simple sobre tabla Daniels)
  const tabla = {50:190.8, 51:187.6, 52:184.6, 53:181.6, 54:178.8}; // minutos
  const v0 = Math.floor(vdotEf), v1 = Math.min(54, v0+1);
  const frac = vdotEf - v0;
  const mins = tabla[v0] + (tabla[v1]-tabla[v0])*(frac||0);
  const hh = Math.floor(mins/60), mm = Math.floor(mins%60), ss = Math.round((mins*60)%60);
  return {
    t: `${hh}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`,
    vdot: vdotEf.toFixed(1),
    cumpl: Math.round(cumpl*100),
    sub3: mins <= 180
  };
}

    h += `<div class="blk"><div class="blk-h">Ritmos<span>VDOT ${d.v}</span></div>`;
    RIT_INFO.forEach(([kk,n,ds,c]) => {
      h += `<div class="rit"><div class="rit-k"><div class="rit-b" style="background:${c}22;color:${c}">${kk}</div>
        <div><div class="rit-n">${n}</div></div></div><div class="rit-v" style="color:${c}">${r[kk]}</div></div>`;
    });
    h += `</div>`;
  }
  if(d.ej && d.ej.length){
    h += `<div class="blk"><div class="blk-h">${d.ej[0].b||'Fuerza'}<span>${d.ej.length} ejercicios</span></div>`;
    d.ej.forEach(e => {
      h += `<div class="ex"><div class="ex-n"><div class="ex-name">${e.n}</div>${e.s?`<div class="ex-set">${e.s}</div>`:''}</div>
        ${e.v?`<a class="ex-v" href="${e.v}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></a>`:''}</div>`;
    });
    h += `</div>`;
  }
  h += `<div class="blk"><div class="blk-h">Nutrición</div><div class="nut">${nutHTML(d.nut)}</div></div>`;
  if(notas[d.f]){
    h += `<div class="blk"><div class="blk-h">Tu nota</div><div class="nut">${notas[d.f]}</div></div>`;
  }
  document.getElementById('sheetC').innerHTML = h;
  document.getElementById('ov').classList.add('on');
}
document.getElementById('ov').onclick = e => { if(e.target.id === 'ov') e.currentTarget.classList.remove('on'); };

// ============ TABS ============
const renders = {hoy:renderHoy, sem:renderSem, dash:renderDash, nut:renderNut, pro:renderPro};
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    const v = t.dataset.v;
    document.getElementById('v-'+v).classList.add('on');
    renders[v]();
    store.set('tab', v);
    window.scrollTo(0,0);
  };
});
