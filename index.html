<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chicago 26">
<meta name="theme-color" content="#0B1015">
<title>Chicago 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1015; --slate:#161E27; --line:#26313D;
  --paper:#E8EDF2; --mute:#7A8899;
  --lake:#2E9BD6;      /* azul lago Michigan */
  --flag:#C8102E;      /* rojo bandera Chicago */
  --gold:#E4B429;      /* estrella */
  --moss:#4FB477;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--ink); color:var(--paper);
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}

/* ---------- HEADER ---------- */
.hd{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,var(--ink) 70%,rgba(11,16,21,.92));
  backdrop-filter:blur(12px);
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  border-bottom:1px solid var(--line);
}
.hd-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hd h1{
  font-family:'Barlow Condensed',sans-serif;
  font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  line-height:.95;
}
.hd h1 em{font-style:normal;color:var(--lake)}
.stars{display:flex;gap:3px;margin-top:5px}
.star{width:9px;height:9px;background:var(--flag);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.cd{text-align:right;flex-shrink:0}
.cd-n{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;color:var(--gold);line-height:1}
.cd-l{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:.14em;margin-top:3px}

/* ---------- TABS ---------- */
.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(22,30,39,.96);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  background:none;border:none;color:var(--mute);
  padding:13px 4px 12px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:color .18s;position:relative;
}
.tab svg{width:19px;height:19px;stroke-width:1.8}
.tab.on{color:var(--paper)}
.tab.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--lake)}

/* ---------- LAYOUT ---------- */
.view{display:none;padding:16px 14px 20px;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mute);margin:22px 2px 9px;display:flex;align-items:center;gap:9px;
}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--line)}
.eyebrow:first-child{margin-top:2px}

/* ---------- CARD PRINCIPAL ---------- */
.hero{
  background:var(--slate);border:1px solid var(--line);border-radius:14px;
  padding:18px;position:relative;overflow:hidden;
}
.hero::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--lake)}
.hero.q::before{background:var(--flag)}
.hero.lr::before{background:var(--gold)}
.hero.off::before{background:var(--line)}
.hero.race::before{background:linear-gradient(180deg,var(--flag),var(--gold),var(--lake))}

.h-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.pill{
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;background:rgba(46,155,214,.16);color:var(--lake);
}
.pill.q{background:rgba(200,16,46,.18);color:#F26B7F}
.pill.lr{background:rgba(228,180,41,.16);color:var(--gold)}
.pill.off{background:rgba(122,136,153,.14);color:var(--mute)}
.h-date{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mute);letter-spacing:.06em}

.h-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:31px;font-weight:700;letter-spacing:.01em;line-height:1.02;margin-bottom:10px;
}
.h-detail{font-size:14px;line-height:1.55;color:#C3CDD8}

.h-stats{display:flex;gap:22px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.st-n{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:700;line-height:1}
.st-l{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:.13em;margin-top:4px}

/* ---------- BLOQUES ---------- */
.blk{
  background:var(--slate);border:1px solid var(--line);border-radius:12px;
  padding:15px;margin-bottom:10px;
}
.blk-h{
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--paper);margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.blk-h span{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--mute);letter-spacing:.06em;font-weight:400;margin-left:auto}

/* ejercicios */
.ex{
  display:flex;align-items:center;gap:11px;
  padding:10px 0;border-bottom:1px solid rgba(38,49,61,.6);
}
.ex:last-child{border-bottom:none;padding-bottom:0}
.ex-n{flex:1;min-width:0}
.ex-name{font-size:13.5px;font-weight:500;line-height:1.3}
.ex-set{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mute);margin-top:2px}
.ex-v{
  flex-shrink:0;width:32px;height:32px;border-radius:8px;
  background:rgba(46,155,214,.12);border:1px solid rgba(46,155,214,.28);
  display:flex;align-items:center;justify-content:center;
  color:var(--lake);text-decoration:none;transition:all .15s;
}
.ex-v:active{background:rgba(46,155,214,.3);transform:scale(.93)}
.ex-v svg{width:14px;height:14px}

.nut{font-size:13px;line-height:1.65;color:#C3CDD8}
.nut b{color:var(--gold);font-weight:600}

/* ---------- SEMANA ---------- */
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.wk-btn{
  background:var(--slate);border:1px solid var(--line);color:var(--paper);
  width:40px;height:40px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.wk-btn:active{background:var(--line)}
.wk-btn:disabled{opacity:.3}
.wk-btn svg{width:17px;height:17px}
.wk-info{text-align:center;flex:1}
.wk-n{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.wk-f{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mute);margin-top:4px;letter-spacing:.05em}

.wk-sum{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;
}
.wk-c{background:var(--slate);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center}
.wk-c-n{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700}
.wk-c-l{font-size:8.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.11em;margin-top:4px}

.day{
  display:flex;gap:12px;padding:13px 14px;
  background:var(--slate);border:1px solid var(--line);border-radius:11px;
  margin-bottom:7px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;
}
.day::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lake)}
.day.q::before{background:var(--flag)}
.day.lr::before{background:var(--gold)}
.day.off::before{background:var(--line)}
.day.race::before{background:linear-gradient(180deg,var(--flag),var(--gold))}
.day:active{background:#1B242F}
.day.today{border-color:var(--lake);box-shadow:0 0 0 1px rgba(46,155,214,.3)}
.day-l{width:34px;flex-shrink:0;text-align:center}
.day-d{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.day-n{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;margin-top:1px}
.day-c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.day-t{font-size:14px;font-weight:600;line-height:1.25}
.day-s{font-size:11px;color:var(--mute);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-km{
  font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;
  align-self:center;flex-shrink:0;color:var(--lake);
}
.day.off .day-km{color:var(--mute);font-size:12px}

/* ---------- PROGRESO ---------- */
.pg-hero{
  background:var(--slate);border:1px solid var(--line);border-radius:14px;
  padding:20px;text-align:center;margin-bottom:12px;
}
.pg-big{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;color:var(--lake);line-height:1}
.pg-sub{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.14em;margin-top:7px}
.bar{height:7px;background:var(--ink);border-radius:4px;overflow:hidden;margin-top:16px;border:1px solid var(--line)}
.bar-f{height:100%;background:linear-gradient(90deg,var(--lake),var(--moss));border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mini{background:var(--slate);border:1px solid var(--line);border-radius:11px;padding:14px}
.mini-n{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700}
.mini-l{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em;margin-top:5px;line-height:1.3}

/* chart volumen */
.chart{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:16px 14px 12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-bottom:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:4px}
.bfill{width:100%;border-radius:3px 3px 0 0;background:var(--lake);opacity:.55;transition:all .3s;min-height:3px}
.bcol.now .bfill{opacity:1;background:var(--gold)}
.bcol.done .bfill{opacity:.85;background:var(--moss)}
.bcol.taper .bfill{background:var(--mute)}
.blab{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--mute)}
.bval{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--paper);font-weight:700}

/* ritmos */
.rit{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(38,49,61,.6)}
.rit:last-child{border-bottom:none;padding-bottom:0}
.rit-k{display:flex;align-items:center;gap:10px}
.rit-b{
  width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;flex-shrink:0;
}
.rit-n{font-size:13px;font-weight:500}
.rit-d{font-size:10px;color:var(--mute);margin-top:1px}
.rit-v{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700}

/* modal */
.ov{
  position:fixed;inset:0;background:rgba(11,16,21,.85);backdrop-filter:blur(6px);
  z-index:100;display:none;align-items:flex-end;
}
.ov.on{display:flex;animation:fade .2s}
.sheet{
  background:var(--slate);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;
  padding:8px 16px calc(28px + env(safe-area-inset-bottom));
  animation:up .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 16px}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-top">
    <div>
      <h1>Chicago <em>2026</em></h1>
      <div class="stars"><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i></div>
    </div>
    <div class="cd">
      <div class="cd-n" id="cdN">--</div>
      <div class="cd-l">días</div>
    </div>
  </div>
</div>

<div class="view on" id="v-hoy"></div>
<div class="view" id="v-sem"></div>
<div class="view" id="v-pro"></div>

<nav class="tabs">
  <button class="tab on" data-v="hoy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    Hoy
  </button>
  <button class="tab" data-v="sem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Semana
  </button>
  <button class="tab" data-v="pro">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17l5-6 4 4 5-8 4 5"/><path d="M3 21h18"/></svg>
    Progreso
  </button>
</nav>

<div class="ov" id="ov"><div class="sheet"><div class="grab"></div><div id="sheetC"></div></div></div>

const RACE = new Date('2026-10-11T07:30:00');
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const RITMOS = {
 50:{E:'5:35-6:15',M:'4:52',T:'4:36',I:'4:13',R:'3:53'},
 51:{E:'5:30-6:10',M:'4:47',T:'4:31',I:'4:09',R:'3:49'},
 52:{E:'5:25-6:04',M:'4:42',T:'4:27',I:'4:05',R:'3:45'},

 54:{E:'5:15-5:54',M:'4:33',T:'4:18',I:'3:57',R:'3:38'}
};
const RIT_INFO = [
 ['E','Easy','Rodaje facil, conversacional','#4FB477'],
 ['M','Maraton','Ritmo objetivo de carrera','#E4B429'],
 ['T','Threshold','Umbral, comodo-duro','#2E9BD6'],
 ['I','Intervalo','VO2 max, duro','#C8102E'],
 ['R','Repeticion','Velocidad, strides','#9B6BD6']
];

function tipo(d){
  const t = d.t || '';
  if(t.includes('MARATON CHICAGO')) return 'race';
  if(t.includes('LONG RUN')) return 'lr';
  if(/INTERVALOS|TEMPO|THRESHOLD|RITMO MARATON/.test(t)) return 'q';
  if(t === 'OFF' || t.includes('OFF running')) return 'off';
  return '';
}
function lbl(k){
  return {race:'Carrera',lr:'Long run',q:'Calidad',off:'Descanso'}[k] || 'Easy';
}
function fmtF(s){
  const d = new Date(s+'T12:00:00');
  return `${DIAS[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`;
}
function hoyISO(){
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
function idxHoy(){
  const h = hoyISO();
  let i = P.findIndex(d => d.f === h);
  if(i >= 0) return i;
  i = P.findIndex(d => d.f > h);
  return i >= 0 ? i : P.length-1;
}

// countdown
function cd(){
  const ms = RACE - new Date();
  document.getElementById('cdN').textContent = ms > 0 ? Math.ceil(ms/86400000) : '0';
}
cd(); setInterval(cd, 60000);

// ============ HOY ============
function renderHoy(){
  const i = idxHoy(), d = P[i], k = tipo(d);
  const r = RITMOS[d.v];
  let h = '';

  h += `<div class="hero ${k}">
    <div class="h-meta">
      <span class="pill ${k}">${lbl(k)}</span>
      <span class="h-date">${fmtF(d.f)} · Sem ${d.s}</span>
    </div>
    <div class="h-title">${d.t}</div>
    <div class="h-detail">${d.det}</div>
    <div class="h-stats">
      ${d.km ? `<div><div class="st-n">${d.km}</div><div class="st-l">km</div></div>` : ''}
      <div><div class="st-n">${d.v}</div><div class="st-l">VDOT</div></div>
      <div><div class="st-n" style="font-size:15px;padding-top:4px">${d.fase}</div><div class="st-l">Fase</div></div>
    </div>
  </div>`;

  if(d.km){
    h += `<div class="eyebrow">Ritmos de hoy</div><div class="blk">`;
    RIT_INFO.forEach(([kk,n,ds,c]) => {
      h += `<div class="rit"><div class="rit-k">
        <div class="rit-b" style="background:${c}22;color:${c}">${kk}</div>
        <div><div class="rit-n">${n}</div><div class="rit-d">${ds}</div></div>
      </div><div class="rit-v" style="color:${c}">${r[kk]}</div></div>`;
    });
    h += `</div>`;
  }

  if(d.ej && d.ej.length){
    const bloque = d.ej[0].b || 'Fuerza';
    h += `<div class="eyebrow">Fuerza</div>
    <div class="blk"><div class="blk-h">${bloque}<span>${d.ej.length} ejercicios</span></div>`;
    d.ej.forEach(e => {
      h += `<div class="ex">
        <div class="ex-n"><div class="ex-name">${e.n}</div>${e.s?`<div class="ex-set">${e.s}</div>`:''}</div>
        ${e.v?`<a class="ex-v" href="${e.v}" target="_blank" rel="noopener" aria-label="Ver video de ${e.n}">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></a>`:''}
      </div>`;
    });
    h += `</div>`;
  }

  h += `<div class="eyebrow">Nutrición</div><div class="blk"><div class="nut">${
    (d.nut||'').split('|').map(s=>s.trim()).filter(Boolean).map(s=>{
      const p = s.split(':');
      return p.length>1 ? `<b>${p[0]}:</b>${p.slice(1).join(':')}` : s;
    }).join('<br>')
  }</div></div>`;

  document.getElementById('v-hoy').innerHTML = h;
}

// ============ SEMANA ============
let semAct = P[idxHoy()].s;
function renderSem(){
  const dd = P.filter(x => x.s === semAct);
  const km = dd.reduce((a,b)=>a+(b.km||0),0);
  const cal = dd.filter(x=>tipo(x)==='q').length;
  const lr = dd.find(x=>tipo(x)==='lr'||tipo(x)==='race');
  const hoy = hoyISO();

  let h = `<div class="wk-nav">
    <button class="wk-btn" onclick="chgSem(-1)" ${semAct<=1?'disabled':''}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="wk-info">
      <div class="wk-n">Semana ${semAct} · ${dd[0].fase}</div>
      <div class="wk-f">${fmtF(dd[0].f)} — ${fmtF(dd[6].f)}</div>
    </div>
    <button class="wk-btn" onclick="chgSem(1)" ${semAct>=12?'disabled':''}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>`;

  h += `<div class="wk-sum">
    <div class="wk-c"><div class="wk-c-n" style="color:var(--lake)">${km}</div><div class="wk-c-l">km total</div></div>
    <div class="wk-c"><div class="wk-c-n" style="color:var(--flag)">${cal}</div><div class="wk-c-l">calidad</div></div>
    <div class="wk-c"><div class="wk-c-n" style="color:var(--gold)">${lr?lr.km:0}</div><div class="wk-c-l">long run</div></div>
  </div>`;

  dd.forEach((d,ix) => {
    const k = tipo(d), dt = new Date(d.f+'T12:00:00');
    h += `<div class="day ${k} ${d.f===hoy?'today':''}" onclick="verDia(${P.indexOf(d)})">
      <div class="day-l"><div class="day-d">${DIAS[dt.getDay()]}</div><div class="day-n">${dt.getDate()}</div></div>
      <div class="day-c"><div class="day-t">${d.t}</div><div class="day-s">${d.ej&&d.ej.length?d.ej[0].b:'Sin fuerza'}</div></div>
      <div class="day-km">${d.km?d.km+'k':'—'}</div>
    </div>`;
  });

  document.getElementById('v-sem').innerHTML = h;
}
function chgSem(n){ semAct = Math.min(12, Math.max(1, semAct+n)); renderSem(); }

// ============ PROGRESO ============

  const hoy = hoyISO();
  const pas = P.filter(d => d.f < hoy);

  const pct = Math.round(kmH/kmT*100);
  const semH = P[idxHoy()].s;
  const dRest = Math.max(0, Math.ceil((RACE-new Date())/86400000));

  const sems = [];
  for(let s=1;s<=12;s++){
    const dd = P.filter(x=>x.s===s);
    sems.push({s, km: dd.reduce((a,b)=>a+(b.km||0),0), fase: dd[0].fase});
  }
  const mx = Math.max(...sems.map(x=>x.km));

  let h = `<div class="pg-hero">
    <div class="pg-big">${pct}%</div>
    <div class="pg-sub">del plan completado</div>
    <div class="bar"><div class="bar-f" style="width:${pct}%"></div></div>
  </div>`;

  h += `<div class="grid2">
    <div class="mini"><div class="mini-n" style="color:var(--moss)">${kmH}</div><div class="mini-l">km recorridos</div></div>
    <div class="mini"><div class="mini-n" style="color:var(--mute)">${kmT-kmH}</div><div class="mini-l">km restantes</div></div>
    <div class="mini"><div class="mini-n" style="color:var(--lake)">${semH}<span style="font-size:14px;color:var(--mute)">/12</span></div><div class="mini-l">semana actual</div></div>
    <div class="mini"><div class="mini-n" style="color:var(--gold)">${dRest}</div><div class="mini-l">días para Chicago</div></div>
  </div>`;

  h += `<div class="eyebrow">Volumen semanal</div><div class="chart"><div class="bars">`;
  sems.forEach(x => {
    const cls = x.s < semH ? 'done' : x.s === semH ? 'now' : x.fase.includes('Taper') ? 'taper' : '';
    h += `<div class="bcol ${cls}">
      <div class="bval">${x.km}</div>
      <div class="bfill" style="height:${x.km/mx*88}%"></div>
      <div class="blab">${x.s}</div>
    </div>`;
  });
  h += `</div></div>`;

  h += `<div class="eyebrow">Ritmos objetivo — VDOT ${P[idxHoy()].v}</div><div class="blk">`;
  const r = RITMOS[P[idxHoy()].v];
  RIT_INFO.forEach(([k,n,d,c]) => {
    h += `<div class="rit"><div class="rit-k">
      <div class="rit-b" style="background:${c}22;color:${c}">${k}</div>
      <div><div class="rit-n">${n}</div><div class="rit-d">${d}</div></div>
    </div><div class="rit-v" style="color:${c}">${r[k]}</div></div>`;
  });
  h += `</div>`;

  h += `<div class="eyebrow">Meta</div><div class="blk">
    <div class="rit"><div class="rit-k"><div><div class="rit-n">VDOT objetivo</div><div class="rit-d">Predice 2:58:47</div></div></div><div class="rit-v" style="color:var(--gold)">54</div></div>
    <div class="rit"><div class="rit-k"><div><div class="rit-n">Ritmo maratón</div><div class="rit-d">Sostener 42.2 km</div></div></div><div class="rit-v" style="color:var(--gold)">4:15</div></div>
    <div class="rit"><div class="rit-k"><div><div class="rit-n">Tiempo meta</div><div class="rit-d">11 octubre 2026</div></div></div><div class="rit-v" style="color:var(--flag)">2:59</div></div>
  </div>`;

  document.getElementById('v-pro').innerHTML = h;
}

// ============ MODAL DIA ============
function verDia(i){
  const d = P[i], k = tipo(d), r = RITMOS[d.v];
  let h = `<div class="hero ${k}" style="border:none;background:transparent;padding:0 0 16px">
    <div class="h-meta"><span class="pill ${k}">${lbl(k)}</span><span class="h-date">${fmtF(d.f)}</span></div>
    <div class="h-title">${d.t}</div>
    <div class="h-detail">${d.det}</div>
  </div>`;

  if(d.km){
    h += `<div class="blk"><div class="blk-h">Ritmos<span>VDOT ${d.v}</span></div>`;
    RIT_INFO.forEach(([kk,n,ds,c]) => {
      h += `<div class="rit"><div class="rit-k"><div class="rit-b" style="background:${c}22;color:${c}">${kk}</div>
        <div><div class="rit-n">${n}</div></div></div><div class="rit-v" style="color:${c}">${r[kk]}</div></div>`;
    });
    h += `</div>`;
  }

  if(d.ej && d.ej.length){
    h += `<div class="blk"><div class="blk-h">${d.ej[0].b||'Fuerza'}<span>${d.ej.length} ejercicios</span></div>`;
    d.ej.forEach(e => {
      h += `<div class="ex"><div class="ex-n"><div class="ex-name">${e.n}</div>${e.s?`<div class="ex-set">${e.s}</div>`:''}</div>
        ${e.v?`<a class="ex-v" href="${e.v}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></a>`:''}</div>`;
    });
    h += `</div>`;
  }

  h += `<div class="blk"><div class="blk-h">Nutrición</div><div class="nut">${
    (d.nut||'').split('|').map(s=>s.trim()).filter(Boolean).map(s=>{
      const p = s.split(':');
      return p.length>1 ? `<b>${p[0]}:</b>${p.slice(1).join(':')}` : s;
    }).join('<br>')
  }</div></div>`;

  document.getElementById('sheetC').innerHTML = h;
  document.getElementById('ov').classList.add('on');
}
document.getElementById('ov').onclick = e => {
  if(e.target.id === 'ov') e.currentTarget.classList.remove('on');
};

// ============ TABS ============
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    const v = t.dataset.v;
    document.getElementById('v-'+v).classList.add('on');
    if(v==='sem') renderSem();
    if(v==='pro') renderPro();
    window.scrollTo(0,0);
  };
});

renderHoy();
</script>
</body>
</html>
